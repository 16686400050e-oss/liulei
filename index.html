<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="京湖内部工作台 - 核心业务系统、自动化工具与技术支持快捷入口">
    <title>京湖内部工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 品牌色改为低饱和度的石板青，更显专业沉稳
                        brand: { 600: '#334155', 700: '#1e293b' }, 
                        // 背景色改为更清透的冷白灰
                        panel: '#f8fafc' 
                    }
                }
            }
        }
    </script>
    <style>
        /* 字体优化 */
        body {
            font-family: "Segoe UI", Roboto, "PingFang SC", sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            color: #1e293b; /* 深石板色文字 */
        }

        /* 卡片样式优化：降低阴影存在感，增加细腻度 */
        .card-shadow {
            background-color: #ffffff;
            border-radius: 1rem;
            padding: 1.25rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0; /* 默认浅灰边框 */
        }
        .card-shadow:hover {
            background-color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-color: #334155; /* 悬停时变为品牌色 */
        }

        /* 滚动条：保持极简灰 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        * { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f8fafc; }

        /* 入场动画 */
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 搜索高亮：改用浅淡的丁香蓝，不刺眼 */
        mark {
            background: #dbeafe;
            color: #1e40af;
            padding: 0 2px;
            border-radius: 2px;
            font-weight: 500;
        }

        /* 单行文本截断 */
        .line-clamp-1 {
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
        }
    </style>
</head>
<body class="bg-panel min-h-screen">

<header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-[1400px] mx-auto px-6 py-3.5 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center">
                <svg class="w-4.5 h-4.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-tight text-slate-900">京湖优品</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest leading-none mt-0.5">Internal Workflow</p>
            </div>
        </div>

        <div class="relative w-full sm:w-72">
            <input type="text" id="searchInput"
                   class="block w-full pl-9 pr-8 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-600 focus:bg-white transition-all"
                   placeholder="搜索系统、工具..."
                   aria-label="搜索内部系统或工具">
            <svg class="w-4 h-4 absolute left-3 top-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <button id="clearSearch"
                    class="absolute right-2 top-1.5 text-slate-300 hover:text-slate-500 transition-colors"
                    aria-label="清空搜索">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </div>
</header>

<main class="max-w-[1400px] mx-auto px-6 py-10">
    <div class="flex justify-center gap-8 mb-10">
        <a href="https://oumai.app.gerpgo.com/" target="_blank" rel="noopener noreferrer"
            class="text-slate-500 hover:text-brand-600 transition-colors underline decoration-slate-300 underline-offset-4 text-lg font-medium">积加 ERP</a>
        <a href="https://qiye.aliyun.com/" target="_blank" rel="noopener noreferrer"
            class="text-slate-500 hover:text-brand-600 transition-colors underline decoration-slate-300 underline-offset-4 text-lg font-medium">阿里邮箱企业版</a>
        <a href="https://www.jianguoyun.com/" target="_blank" rel="noopener noreferrer"
            class="text-slate-500 hover:text-brand-600 transition-colors underline decoration-slate-300 underline-offset-4 text-lg font-medium">坚果云网页版</a>
    </div>

    <div id="navContainer" aria-live="polite" role="region" aria-label="导航分类结果"></div>
</main>

<footer class="text-center py-10 text-slate-400 text-[11px] tracking-[0.2em] font-medium uppercase">
    © <span id="currentYear"></span> JINGHU · Operations & Technology Center
</footer>

<script>
    /* 原有 JavaScript 逻辑完全保持不变 */
    (function() {
        'use strict';

        document.getElementById('currentYear').textContent = new Date().getFullYear();

        const NAV_DATA = [
            {
                category: "常用查询",
                items: [
                    { name: "海关编码", url: "https://www.hsbianma.com/", desc: "海关编码查询、商品归类与进出口申报参考", tag: "报关, 编码查询" },
                    { name: "美国商标查询入口", url: "https://tmsearch.uspto.gov/search/search-information", desc: "美国官方商标检索、可用性查询平台", tag: "商标, 美国" },
                    { name: "欧盟商标局入口", url: "https://euipo.europa.eu/ohimportal/en/search-availability", desc: "欧盟商标官方查询、注册状态检索工具", tag: "商标, 欧盟" },
                    { name: "商标查询 51IP", url: "https://www.ip51.com/brand/search", desc: "跨境电商专利查询、侵权风险检测", tag: "推荐，快捷" },
                    { name: "睿观查专利", url: "https://detect.eric-bot.com/eric", desc: "跨境电商专利查询、侵权风险检测", tag: "专利, 风控" },
                    { name: "智慧芽", url: "https://account.zhihuiya.com/", desc: "专业专利检索、知识产权数据库平台", tag: "查专利" }
                ]
            },
            {
                category: "飞书常用应用",
                items: [
                    { name: "新品开发需求收集表单", url:"https://jinghuyoupin.feishu.cn/share/base/form/shrcnT6VemfrTVMjtDlvCVuIq4c" , desc: "新品开发需求提报、收集与汇总", tag: "表单,需求管理" },
                    { name: "产品开发系统v1.0", url: "https://jinghuyoupin.feishu.cn/wiki/TnPUwv2U5isQ1HkQUfTcu85BnOh?from=from_copylink", desc: "产品开发全流程协作", tag: "飞书,项目管理" },
                ]
            },
            {
                category: "产品宝典",
                items: [
                    { name: "SKU命名+图片+产品名规范", url:"https://jinghuyoupin.feishu.cn/docx/HjQCdYIsJoJDB8x4236cJK3ynOg?from=from_copylink" , desc: "SKU命名、图片、产品名统一规范文档", tag: "规范,产品管理" },
                ]
            },
            {
                category: "物流宝典",
                items: [
                    { name: "中国海关编码查询网站", url:"https://www.hsbianma.com/Home/Message" , desc: "海关编码查询、商品归类与报关参考", tag: "报关,编码查询" },
                    { name: "备货的报关方式区分及要求", url: "https://jinghuyoupin.feishu.cn/wiki/EVcsw22vUiAWaFk01KicfEgdnqf", desc: "备货报关方式说明与操作要求", tag: "物流,报关规范" },
                ]
            },
            {
                category: "规章制度",
                items: [
                    { name: "人生・事业的结果=思维方式×热情×能力", url:"https://jinghuyoupin.feishu.cn/wiki/VjnUwCUJriuY6Ek9qN8c1E1ynQh" , desc: "企业文化与工作理念学习文档", tag: "文化,理念" },
                ]
            },
            {
                category: "模板库",
                items: [
                    { name: "新增 SKU 模板 （飞书云文档-模板库）", url:"https://jinghuyoupin.feishu.cn/drive/folder/FzDifq2PdlDBiBd7eB4cPywrnPe" , desc: "新增SKU标准模板与填写规范", tag: "模板,SKU管理" },
                ]
            },
        ];

        const container = document.getElementById('navContainer');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearch');
        let currentKeyword = '';

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlightText(text, keyword) {
            if (!keyword || !text) return text;
            const regex = new RegExp(`(${escapeRegExp(keyword)})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        function renderNav(data, keyword) {
            const fragment = document.createDocumentFragment();
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                        <svg class="w-12 h-12 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <p class="text-base font-medium">未找到匹配的系统</p>
                    </div>
                `;
                return;
            }

            data.forEach((group, gIdx) => {
                const section = document.createElement('section');
                section.className = 'mb-10 fade-in';
                section.style.animationDelay = `${gIdx * 0.05}s`;

                const headerDiv = document.createElement('div');
                headerDiv.className = 'flex items-center gap-3 mb-5';
                headerDiv.innerHTML = `
                    <h2 class="text-[14px] font-bold text-slate-400 tracking-[0.15em] whitespace-nowrap uppercase">${group.category}</h2>
                    <div class="h-px bg-slate-200 w-full"></div>
                `;
                section.appendChild(headerDiv);

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4';

                group.items.forEach(item => {
                    const nameHtml = highlightText(item.name, keyword);
                    const descHtml = highlightText(item.desc, keyword);
                    const tagHtml = highlightText(item.tag, keyword);

                    const card = document.createElement('a');
                    card.href = item.url;
                    card.target = "_blank";
                    card.setAttribute('rel', 'noopener noreferrer');
                    card.className = 'card-shadow group flex flex-col h-full'; 
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-1.5">
                            <h3 class="text-[16px] font-bold text-slate-800 group-hover:text-brand-600 transition-colors">${nameHtml}</h3>
                            <svg class="w-3 h-3 text-slate-300 group-hover:text-brand-600 transition-colors flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </div>
                        <p class="text-[14px] text-slate-500 leading-snug mb-4 line-clamp-1">${descHtml}</p>
                        <div class="mt-auto">
                            <span class="px-2 py-0.5 rounded-md border border-slate-200 text-slate-400 text-[12px] font-medium group-hover:bg-brand-600 group-hover:text-white group-hover:border-brand-600 transition-colors">${tagHtml}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                fragment.appendChild(section);
            });

            container.appendChild(fragment);
        }

        function filterData(keyword) {
            if (!keyword) return NAV_DATA;
            const lowerKeyword = keyword.toLowerCase();
            return NAV_DATA.map(group => ({
                category: group.category,
                items: group.items.filter(item =>
                    item.name.toLowerCase().includes(lowerKeyword) ||
                    item.desc.toLowerCase().includes(lowerKeyword) ||
                    item.tag.toLowerCase().includes(lowerKeyword)
                )
            })).filter(group => group.items.length > 0);
        }

        let searchTimer;
        function handleSearchInput() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                const keyword = searchInput.value.trim();
                currentKeyword = keyword;
                const filtered = filterData(keyword);
                renderNav(filtered, keyword);
            }, 300);
        }

        function clearSearch() {
            searchInput.value = '';
            currentKeyword = '';
            renderNav(NAV_DATA, '');
            searchInput.focus();
        }

        searchInput.addEventListener('input', handleSearchInput);
        clearBtn.addEventListener('click', clearSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                clearTimeout(searchTimer);
                const keyword = searchInput.value.trim();
                currentKeyword = keyword;
                const filtered = filterData(keyword);
                renderNav(filtered, keyword);
            }
        });

        renderNav(NAV_DATA, '');
    })();
</script>
</body>
</html>
